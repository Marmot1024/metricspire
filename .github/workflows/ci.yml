name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: metricspire_test
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: metricspire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metricspire_test -d metricspire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: lab
          CLICKHOUSE_PASSWORD: ci-only-disposable
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 8123:8123
        options: >-
          --memory 2g --cpus 2
          --health-cmd "wget -q -O - http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python3 tools/check_docs.py
      - run: node --test internal/httpapi/ui/app_test.js
      - run: python3 -m unittest tools/test_mcp_installer.py tools/test_oidc_builder.py
      - run: python3 -m unittest tools/test_deploy_staging.py
      - run: python3 -m unittest discover -s deploy/databricks-apps -p test_render.py
      - run: go mod verify
      - name: Test with real PostgreSQL and ClickHouse (catalog and online HTTP)
        env:
          METRICSPIRE_REQUIRE_POSTGRES_TESTS: '1'
          METRICSPIRE_REQUIRE_CLICKHOUSE_TESTS: '1'
          METRICSPIRE_CLICKHOUSE_TEST_URL: http://lab:ci-only-disposable@127.0.0.1:8123/
          METRICSPIRE_TEST_DATABASE_URL: postgres://metricspire_test:ci-only-disposable@127.0.0.1:5432/metricspire_test?sslmode=disable
          METRICSPIRE_ONLINE_TEST_DATABASE_URL: postgres://metricspire_test:ci-only-disposable@127.0.0.1:5432/metricspire_test?sslmode=disable
        run: go test -race -count=1 -v ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' ./cmd/metricspire
      - name: Build and smoke-test the restricted Docker context
        if: matrix.go == '1.26.x'
        run: |
          docker build -t metricspire:ci .
          docker run --rm --network none -v "$PWD/config/domains.example.yaml:/etc/metricspire/domains.yaml:ro" metricspire:ci validate-domains --config /etc/metricspire/domains.yaml

  external-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [trino, presto]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Start disposable public TPCH and metadata services
        env:
          METRICSPIRE_LAB_PASSWORD: ci-only-disposable
        run: |
          docker compose -f deploy/testing/compose.yaml --profile analytical up -d postgres "${{ matrix.engine }}"
          export ENGINE_PORT=$([ "${{ matrix.engine }}" = trino ] && echo 18080 || echo 18081)
          python3 - <<'PYREADY'
          import json, os, time, urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:" + os.environ["ENGINE_PORT"] + "/v1/info", timeout=2) as response:
                      info = json.load(response)
                  if info.get("starting") is False:
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Disposable engine did not finish startup")
          PYREADY
      - name: Real engine, OIDC, native MCP and durable audit
        env:
          METRICSPIRE_ONLINE_TEST_DATABASE_URL: postgres://postgres:ci-only-disposable@127.0.0.1:15432/metricspire_test?sslmode=disable
        run: |
          if [ "${{ matrix.engine }}" = trino ]; then
            export METRICSPIRE_TRINO_TEST_URL=http://127.0.0.1:18080 METRICSPIRE_REQUIRE_TRINO_TESTS=1
          else
            export METRICSPIRE_PRESTO_TEST_URL=http://127.0.0.1:18081 METRICSPIRE_REQUIRE_PRESTO_TESTS=1
          fi
          go test -race -count=1 -v ./internal/adapter/trinoquery ./cmd/metricspire -run 'TestRealTPCH|TestServeTrinoPrestoWithoutDatabricks'
      - name: Fixture failure diagnostics
        if: failure()
        env:
          METRICSPIRE_LAB_PASSWORD: ci-only-disposable
        run: docker compose -f deploy/testing/compose.yaml --profile analytical logs --tail=80 postgres "${{ matrix.engine }}"
