# Disposable synthetic fixtures only. Never mount a workspace or company assets.
name: metricspire-lab
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metricspire_test
      POSTGRES_PASSWORD: ${METRICSPIRE_LAB_PASSWORD:?set a lab-only password}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metricspire_test"]
      interval: 5s
      timeout: 3s
      retries: 30
  mysql:
    profiles: [metadata]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: metricspire_test
      MYSQL_ROOT_PASSWORD: ${METRICSPIRE_LAB_PASSWORD:?set a lab-only password}
      MYSQL_ROOT_HOST: "%"
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 40
  clickhouse:
    profiles: [analytical]
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: synthetic
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: ${METRICSPIRE_LAB_PASSWORD:?set a lab-only password}
    ports: ["127.0.0.1:18123:8123"]
    volumes: ["clickhouse-data:/var/lib/clickhouse", "./clickhouse.xml:/etc/clickhouse-server/config.d/metricspire-lab.xml:ro"]
    mem_limit: 3g
    cpus: 2
    ulimits:
      nofile: {soft: 262144, hard: 262144}
  trino:
    profiles: [analytical]
    image: trinodb/trino:484
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["./trino/jvm.config:/etc/trino/jvm.config:ro"]
    mem_limit: 3g
    cpus: 2
  presto:
    profiles: [analytical]
    image: prestodb/presto:0.299
    ports: ["127.0.0.1:18081:8080"]
    volumes: ["./presto/jvm.config:/opt/presto-server/etc/jvm.config:ro", "./presto/config.properties:/opt/presto-server/etc/config.properties:ro", "./presto/tpch.properties:/opt/presto-server/etc/catalog/tpch.properties:ro"]
    mem_limit: 3g
    cpus: 2
volumes:
  postgres-data:
  clickhouse-data:
  mysql-data:
