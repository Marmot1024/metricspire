  <text class="body" x="164" y="726">Collect and prepare data</text>
  <path class="line" d="M304 706H352" marker-end="url(#arrow)"/>
  <rect class="box" x="352" y="652" width="584" height="100" rx="8"/>
  <text class="title" x="644" y="680">OLAP engine / warehouse</text>
  <text class="body" x="644" y="711">Business data and computation</text>
  <text class="small" x="644" y="741">Design: ClickHouse / Doris / Databricks SQL</text>
  <text class="small" x="480" y="787">Logical integration view · Available database adapters are listed in the documentation.</text>
</svg>
