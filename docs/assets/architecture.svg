<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
  <title id="title">How MetricSpire connects your data stack</title>
  <desc id="desc">Clients call MetricSpire. It stores metric definitions separately from business data, queries OLAP through adapters, and optionally loads external semantics for exploration.</desc>
  <!-- Logical integration view. Concrete adapter availability: ../architecture.md#adapter-support -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#53697e" stroke-width="1.5"/></marker></defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Noto Sans CJK SC', sans-serif; fill: #142b40; text-anchor: middle; }
    .title { font-size: 23px; font-weight: 600; }
    .body { font-size: 20px; fill: #42596c; }
    .small { font-size: 18px; fill: #53697e; }
    .line { fill: none; stroke: #53697e; stroke-width: 2; }
    .box { fill: #fff; stroke: #c5d2dc; stroke-width: 1.5; }
  </style>
  <rect width="960" height="800" fill="#fff"/>

  <rect class="box" x="24" y="24" width="280" height="88" rx="8"/>
  <text class="title" x="164" y="60">Web users</text>
  <text class="body" x="164" y="90">Catalog and queries</text>
  <path class="line" d="M164 112V140"/>
  <rect class="box" x="340" y="24" width="280" height="88" rx="8"/>
  <text class="title" x="480" y="60">Applications</text>
  <text class="body" x="480" y="90">HTTP API</text>
  <path class="line" d="M480 112V140"/>
  <rect class="box" x="656" y="24" width="280" height="88" rx="8"/>
  <text class="title" x="796" y="60">AI assistants</text>
  <text class="body" x="796" y="90">MCP</text>
  <path class="line" d="M796 112V140"/>
  <path class="line" d="M164 140H796"/>
  <path class="line" d="M480 140V178" marker-end="url(#arrow)"/>
  <rect class="box" x="24" y="178" width="912" height="238" rx="8" style="fill:#f2f7fa;stroke:#7798ad" stroke="#7798ad"/>
  <text class="title" x="48" y="217" style="text-anchor:start">MetricSpire</text>
  <rect class="box" x="44" y="240" width="264" height="122" rx="8"/>
  <text class="title" x="176" y="276">Metric catalog</text>
  <text class="body" x="176" y="310">Meaning and calculations</text>
  <text class="body" x="176" y="340">Review and versions</text>
  <rect class="box" x="348" y="240" width="264" height="122" rx="8"/>
  <text class="title" x="480" y="276">Data service</text>
  <text class="body" x="480" y="310">Metric queries</text>
  <text class="body" x="480" y="340">Result tables</text>
  <rect class="box" x="652" y="240" width="264" height="122" rx="8" stroke-dasharray="6 5"/>
  <text class="title" x="784" y="276">Exploration · optional</text>
  <text class="body" x="784" y="310">Temporary analyses</text>
  <text class="body" x="784" y="340">External semantics</text>
  <text class="body" x="480" y="396">Shared access checks · query limits · audit</text>
  <path class="line" d="M164 416V484" marker-end="url(#arrow)"/>
  <text class="small" x="164" y="456">Save metadata</text>
  <path class="line" d="M480 416V484" marker-end="url(#arrow)"/>
  <path class="line" d="M796 484V416" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  <rect class="box" x="24" y="484" width="280" height="110" rx="8"/>
  <text class="title" x="164" y="518">Metric storage</text>
  <text class="body" x="164" y="549">Definitions · versions · audit</text>
  <text class="small" x="164" y="579">Design: MySQL / PostgreSQL</text>
  <rect class="box" x="340" y="484" width="280" height="110" rx="8"/>
  <text class="title" x="480" y="529">OLAP adapter</text>
  <text class="body" x="480" y="565">Connect and execute queries</text>
  <rect class="box" x="656" y="484" width="280" height="110" rx="8" stroke-dasharray="6 5"/>
  <text class="title" x="796" y="518">External semantic layer</text>
  <text class="body" x="796" y="549">Optional repository</text>
  <text class="small" x="796" y="579">Fields · relationships · rules</text>
  <path class="line" d="M480 594V652" marker-end="url(#arrow)"/>
  <text class="small" x="560" y="630">Execute queries</text>
  <rect class="box" x="24" y="652" width="280" height="100" rx="8"/>
